an\"},\"romaji\":\"Fumoto Ryokan\",\"area\":{\"ja\":\"黒川温泉\",\"en\":\"Kurokawa Onsen\"},\"prefecture\":{\"ja\":\"熊本県\",\"en\":\"Kumamoto\"},\"region\":\"kyushu_okinawa\",\"location\":{\"lat\":33.077988,\"lng\":131.140473,\"address\":{\"ja\":\"熊本県阿蘇郡南小国町満願寺（黒川温泉）\",\"en\":\"Manganji, Minamioguni-machi, Aso-gun, Kumamoto (Kurokawa Onsen)\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"黒川温泉旅館組合のサイトにも施設側にも、入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。訪問前に施設へ電話でご確認ください。\",\"en\":\"Neither the Kurokawa ryokan association nor the inn publishes anything about tattoos. That is not the same as having no rule — call ahead before you visit.\"}},\"bath\":{\"types\":[\"outdoor\"],\"springQualities\":[],\"rulesNote\":{\"ja\":\"露天風呂には男女ともシャワー設備がありません。別館「麓庵」も同じ宿の運営です。\",\"en\":\"Neither the men's nor the women's open-air bath has showers. The annexe, Rokuan, is run by the same inn.\"}},\"visit\":{\"dayUse\":true,\"overnight\":true,\"dayUsePriceYen\":600,\"priceNote\":{\"ja\":\"黒川温泉の「入湯手形」は大人1枚1,500円、購入日から6ヶ月有効で、加盟する25ヵ所の露天風呂から3ヵ所を選んで入浴できます（8:30〜21:00）。露天風呂は原則撮影禁止です。日帰り入浴の受付時間は宿の都合で日ごとに変わるため、黒川温泉旅館組合の「日帰り入浴状況」ページで当日分をご確認ください。\",\"en\":\"Kurokawa's nyuto-tegata pass costs ¥1,500 for an adult, stays valid six months, and lets you pick three of the town's 25 open-air baths between 8:30 and 21:00. Photography in the open-air baths is generally not allowed. Day-use hours are set by each inn day by day, so check the association's daily bathing-status page for the day you visit.\"}},\"access\":{\"carRecommended\":true},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"onsen_town_walk\"],\"website\":\"http://www.fumotoryokan.com/\",\"sources\":{\"officialUrl\":\"http://www.fumotoryokan.com/\",\"additionalUrls\":[\"https://www.kurokawaonsen.or.jp/nyuyoku/\",\"https://www.kurokawaonsen.or.jp/tegata/\",\"https://www.kurokawaonsen.or.jp/oyado/innInfo.php?intYKey=17\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"m o Open-Air Bath\"},\"romaji\":\"Ikaho Open-Air Bath\",\"area\":{\"ja\":\"渋川伊香保温泉\",\"en\":\"Shibukawa-Ikaho Onsen\"},\"prefecture\":{\"ja\":\"群馬県\",\"en\":\"Gunma\"},\"region\":\"kanto\",\"description\":{\"ja\":\"伊香保の源泉地にある露天風呂。源泉「黄金の湯」を掛け流しで使っています。向かう道中には、伊香保で唯一「黄金の湯」を飲める飲泉所があります。\",\"en\":\"An open-air bath at the spring head itself, running free-flowing on the Kogane-no-yu source. On the way up there is the one place in Ikaho where you can drink that water.\"},\"location\":{\"address\":{\"ja\":\"群馬県渋川市伊香保町伊香保581（伊香保温泉）\",\"en\":\"伊香保温泉 area, Shibukawa, Gunma\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"施設側にも渋川伊香保温泉観光協会にも、入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。訪問前に施設へ電話でご確認ください。\",\"en\":\"Neither the facility nor the Shibukawa-Ikaho tourism association publishes anything about tattoos. That is not the same as having no rule — call ahead before you visit.\"}},\"bath\":{\"types\":[\"outdoor\"],\"springQualities\":[],\"freeFlowing\":true,\"rulesNote\":{\"ja\":\"洗い場はありません。\",\"en\":\"There is no washing area.\"}},\"visit\":{\"dayUse\":true,\"overnight\":false,\"hours\":{\"ja\":\"4〜9月 9:00〜18:00／10〜3月 10:00〜18:00（最終入場 17:30）\",\"en\":\"April to September 9:00-18:00; October to March 10:00-18:00 (last entry 17:30)\"},\"closedDays\":{\"ja\":\"第1・第3木曜（祝日の場合は営業。8月は無休）\",\"en\":\"First and third Thursday, unless a public holiday; open every day in August\"},\"dayUsePriceYen\":600,\"priceNote\":{\"ja\":\"大人600円、小学生以下300円、障がい者150円。タオル400円、バスタオル1,200円。\",\"en\":\"¥600 adult, ¥300 primary school and under, ¥150 with a disability certificate. Towels ¥400, bath towels ¥1,200.\"}},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"onsen_town_walk\"],\"website\":\"https://www.ikaho-kankou.com/spring/spa1/\",\"sources\":{\"officialUrl\":\"https://www.ikaho-kankou.com/spring/spa1/\",\"additionalUrls\":[\"https://www.ikaho-kankou.com/spring/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"man -ryokan.com/\",\"additionalUrls\":[\"https://www.kurokawaonsen.or.jp/nyuyoku/\",\"https://www.kurokawaonsen.or.jp/tegata/\",\"https://www.kurokawaonsen.or.jp/oyado/innInfo.php?intYKey=1\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"unverified\"},{\"slug\":\"bessho-ishiyu\",\"name\":{\"ja\":\"石湯\",\"en\":\"Ishi-yu\"},\"romaji\":\"Ishi-yu\",\"area\":{\"ja\":\"別所温泉\",\"en\":\"Bessho Onsen\"},\"prefecture\":{\"ja\":\"長野県\",\"en\":\"Nagano\"},\"region\":\"chubu\",\"description\":{\"ja\":\"真田幸村の隠し湯と伝えられる外湯。4号源泉を掛け流しと循環ろ過の併用で使っています。女湯には有料のドライヤーがあります。\",\"en\":\"Said to have been Sanada Yukimura's hidden bath. It runs on the fourth source, part free-flowing and part filtered. There is a coin dryer on the women's side.\"},\"location\":{\"address\":{\"ja\":\"長野県上田市別所温泉\",\"en\":\"Bessho Onsen, Ueda, Nagano\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"施設側にも別所温泉観光協会にも、入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。共同浴場の問い合わせ先は別所温泉財産区（0268-38-5750）です。\",\"en\":\"Neither the bathhouse nor the Bessho tourism association publishes anything about tattoos. That is not the same as having no rule. Enquiries about the bathhouses go to the Bessho Onsen public trust on 0268-38-5750.\"}},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[],\"rulesNote\":{\"ja\":\"タオル・石けん・シャンプー・ひげ剃りは番台で買えます。100円リターン式の貴重品ロッカーがあります。毎月26日は小学生以下が無料（石湯・大師湯・大湯の3浴場）。\",\"en\":\"Towels, soap, shampoo and razors are sold at the desk, and there are ¥100-return lockers for valuables. On the 26th of each month children of primary-school age and under go free at the three bathhouses.\"}},\"visit\":{\"dayUse\":true,\"overnight\":false,\"hours\":{\"ja\":\"6:30〜21:30\",\"en\":\"6:30-21:30\"},\"closedDays\":{\"ja\":\"火曜\",\"en\":\"Tuesdays\"},\"dayUsePriceYen\":300,\"priceNote\":{\"ja\":\"300円。毎月26日は小学生以下が無料です。\",\"en\":\"¥300. Children of primary-school age and under go free on the 26th of each month.\"},\" to\",\"description\":{\"ja\":\"共同浴場「地蔵の湯」の前にある足湯。同じ広場に、2021年にできた顔湯と手洗乃湯もあります。\",\"en\":\"The footbath outside Jizo-no-yu. On the same square there is a face bath and a hand bath, both added in 2021.\"},\"location\":{\"address\":{\"ja\":\"群馬県吾妻郡草津町大字草津\",\"en\":\"Kusatsu, Kusatsu-machi, Agatsuma-gun, Gunma\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"この共同浴場について入れ墨・タトゥーの記載は見つかりませんでした。ただし草津温泉の公式FAQは、有料の三湯（大滝乃湯・御座之湯・西の河原露天風呂）について「刺青（タトゥー）のある方の入館、入浴を特にお断りはしておりません」と述べています。共同浴場は地元の方が管理する別の施設なので、同じ扱いとは限りません。\",\"en\":\"Nothing is published about tattoos for this communal bath. Kusatsu's official FAQ does say that its three paid baths — Otaki-no-yu, Goza-no-yu and Sainokawara — do not refuse people with tattoos. These communal baths are run separately by the neighbourhood, so that answer does not necessarily carry over.\"}},\"bath\":{\"types\":[\"footbath\"],\"springQualities\":[\"sulfur\",\"acidic\"]},\"visit\":{\"dayUse\":true,\"overnight\":false,\"hours\":{\"ja\":\"24時間\",\"en\":\"24 hours\"},\"dayUsePriceYen\":0,\"priceNote\":{\"ja\":\"無料です。\",\"en\":\"Free.\"}},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"onsen_town_walk\"],\"sources\":{\"officialUrl\":\"https://www.kusatsu-onsen.ne.jp/kankou/1095.php\",\"additionalUrls\":[\"https://www.kusatsu-onsen.ne.jp/kankou/1095.php\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"unverified\"},{\"slug\":\"kusatsu-jizo-no-yu\",\"name\":{\"ja\":\"地蔵の湯\",\"en\":\"Jizo-no-yu\"},\"romaji\":\"Jizo-no-yu\",\"area\":{\"ja\":\"草津温泉\",\"en\":\"Kusatsu Onsen\"},\"prefecture\":{\"ja\":\"群馬県\",\"en\":\"Gunma\"},\"region\":\"kanto\",\"description\":{\"ja\":\"やや白濁した湯の共同湯で、源泉は地蔵。湯畑から徒歩3分です。\",\"en\":\"Slightly cloudy water from the Jizo source, three minutes from the Yubatake.\"},\"location\":{\"address\":{\"ja\":\"群馬県吾妻郡草津町大字草津\",\"en\":\"Kusatsu, Kusatsu-machi, Agatsuma-gun, Gunma\ gers, with no published rule about tattoos. Baths of this kind cannot refuse use without proper grounds, but what is posted varies from one to the next, so check when you arrive.\"},\"checkedAt\":\"2026-08-29\",\"sourceUrl\":\"https://nozawakanko.jp/hotspring/\"},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[\"sulfur\"],\"genderArrangement\":\"separate\",\"rulesNote\":{\"ja\":\"レトロモダンな二階建て。一階が女湯、二階が男湯という村で唯一の造りで、洗濯場を併設。温泉たまごの釜があります。共同浴場の作法として、入浴前に体を洗う／浴槽にタオルを入れない／湯が熱ければ加水せず給水を止める／深夜の入浴は控える、が求められます。\",\"en\":\"A two-storey bathhouse, the only one where the women's bath is downstairs and the men's up. It has a laundry area and an egg-boiling cauldron. House rules of a communal bath: wash before getting in, keep the towel out of the water, turn the inflow off rather than adding cold water, and do not bathe late at night.\"}},\"visit\":{\"dayUse\":true,\"dayUsePriceYen\":0,\"priceNote\":{\"ja\":\"村人が「湯仲間」の制度で維持・管理しており、賽銭箱への寸志の寄付が慣習です。\",\"en\":\"Maintained by residents under the yunakama system; a small donation in the box is customary.\"},\"towel\":\"bring_your_own\",\"payments\":[\"cash\"]},\"access\":{\"nearestStation\":{\"name\":{\"ja\":\"飯山駅\",\"en\":\"Iiyama Sta.\"},\"busMinutes\":25,\"note\":{\"ja\":\"北陸新幹線飯山駅からバス約25分。外湯は温泉街を歩いて回れる範囲に13湯あります。\",\"en\":\"About 25 minutes by bus from Iiyama Station on the Hokuriku Shinkansen. All thirteen baths are within walking distance of one another.\"}},\"carRecommended\":false},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"onsen_town_walk\",\"snow_view\",\"skiing\"],\"website\":\"https://nozawakanko.jp/hotspring/\",\"sources\":{\"officialUrl\":\"https://nozawakanko.jp/hotspring/\",\"additionalUrls\":[\"https://nozawakanko.jp/about/hot_spring/sotoyu/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-29\",\"lastChangedAt\":\"2026-08-29\",\"method\":\"manual\",\"staleAfterDays\":180},\"dataStatus\":\"unverified\"},{\"slug\":\"misasa-kabuyu\",\"name\":{\"ja\":\"公衆浴場「株湯」\",\"en\":\"Kabu-y n\":\"Kurokawa's nyuto-tegata pass costs ¥1,500 for an adult, stays valid six months, and lets you pick three of the town's 25 open-air baths between 8:30 and 21:00. Photography in the open-air baths is generally not allowed. Day-use hours are set by each inn day by day, so check the association's daily bathing-status page for the day you visit.\"}},\"access\":{\"carRecommended\":true},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"onsen_town_walk\"],\"website\":\"http://www.kounoyu.jp/\",\"sources\":{\"officialUrl\":\"http://www.kounoyu.jp/\",\"additionalUrls\":[\"https://www.kurokawaonsen.or.jp/nyuyoku/\",\"https://www.kurokawaonsen.or.jp/tegata/\",\"https://www.kurokawaonsen.or.jp/oyado/innInfo.php?intYKey=8\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"unverified\"},{\"slug\":\"shizuoka-kuchisakamoto\",\"name\":{\"ja\":\"口坂本温泉浴場\",\"en\":\"Kuchisakamoto Onsen Bathhouse\"},\"romaji\":\"Kuchisakamoto Onsen\",\"area\":{\"ja\":\"口坂本温泉\",\"en\":\"Kuchisakamoto Onsen\"},\"prefecture\":{\"ja\":\"静岡県\",\"en\":\"Shizuoka\"},\"region\":\"chubu\",\"location\":{\"address\":{\"ja\":\"静岡県静岡市葵区口坂本652\",\"en\":\"652 Kuchisakamoto, Aoi-ku, Shizuoka\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"静岡市営の浴場です。同じ静岡市営の「やませみの湯」は地方自治法第244条を挙げてタトゥーを理由に入浴を断らないと明記していますが、この浴場自身は公表していません。公営の施設は正当な理由なく利用を拒めない立場にありますが、掲示や運用は施設ごとに異なりうるため、事前の確認をおすすめします。\",\"en\":\"A Shizuoka City bath. A sister municipal bath, Yamasemi-no-yu, cites Article 244 of the Local Autonomy Act and states that it refuses nobody on account of a tattoo; this one publishes nothing either way. A public facility cannot refuse use without proper grounds, but what is posted at the door varies, so call ahead.\"},\"checkedAt\":\"2026-08-29\",\"sourceUrl\":\"https://kuchisakamoto.jp/\"},\"bath\":{\"types\":[\"indoor\",\"outdoor\"],\"springQualities\":[\"bicarbonate\"],\"freeFlowing\": ndly_beppuonsen_japan/\"},\"bath\":{\"types\":[\"indoor\",\"private\"],\"springQualities\":[]},\"visit\":{\"dayUse\":true,\"hours\":{\"ja\":\"7:00 - 14:00, 15:00 - 20:00\",\"en\":\"7:00AM - 2:00PM, 3:00PM - 8:00PM\"},\"closedDays\":{\"ja\":\"第2 水曜 （祝日の場合は変更あり）\",\"en\":\"2nd Wed. (may change if holiday)\"},\"dayUsePriceYen\":300,\"priceNote\":{\"ja\":\"貸切風呂: 2000円 ／60分\",\"en\":\"Private bath: 2000YEN for 60min\"}},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[],\"sources\":{\"officialUrl\":\"https://enjoyonsen.city.beppu-jp.com/onsen/100tattoo-friendly_beppuonsen_japan/\"},\"verification\":{\"lastCheckedAt\":\"2026-08-29\",\"lastChangedAt\":\"2026-08-29\",\"method\":\"manual\",\"staleAfterDays\":120},\"dataStatus\":\"unverified\"},{\"slug\":\"shibu-oyu\",\"name\":{\"ja\":\"渋温泉 大湯\",\"en\":\"Shibu Onsen Oyu\"},\"romaji\":\"Shibu Onsen Oyu\",\"area\":{\"ja\":\"渋温泉\",\"en\":\"Shibu Onsen\"},\"prefecture\":{\"ja\":\"長野県\",\"en\":\"Nagano\"},\"region\":\"chubu\",\"description\":{\"ja\":\"渋温泉を代表する湯で、行基が見つけた霊泉と伝えられます。地下の源泉の湯気を使った蒸し風呂があり、屋上には同じ源泉の足湯もあります。渋温泉の九つの外湯のうち、宿泊しない人が入れるのはこの大湯だけです。\",\"en\":\"Shibu's principal bath, said to have been found by the monk Gyoki. There is a steam room heated by the source below the building, and a footbath on the roof from the same water. Of Shibu's nine public baths, this is the only one open to people who are not staying in the town.\"},\"location\":{\"lat\":36.74134,\"lng\":138.43221,\"address\":{\"ja\":\"長野県下高井郡山ノ内町平穏2178\",\"en\":\"2178 Hirao, Yamanouchi-machi, Shimotakai-gun, Nagano\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"公式サイトに入れ墨・タトゥーに関する記載がありません。訪問前に施設へ電話でご確認ください。\",\"en\":\"The facility's own site says nothing about tattoos. Call ahead before visiting.\"}},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[],\"genderArrangement\":\"separate\",\"rulesNote\":{\"ja\":\"洗髪は禁止です。シャンプーやボディソープの備え付けはありません。入浴券を観光案内所か大湯付近の旅館で買い、開錠施設で提示して鍵を開けてもらう仕組みです。\",\"en\":\"Washing your hair is not allowed, and no shampoo or body wash is provided. You buy a ticket at the tourist office or one of the inns near the bath, then show it at one of the listed places to have the door unlocked.\"}},\"visit\":{\"dayUse\":true,\"hours\":{\"ja\":\"10:00〜17:00\",\"en\":\"10:00-17:00\"},\"dayUsePriceYen\":800,\"priceNote\":{\"ja\":\"大人800円、小人500円。臨時休業の場合があります。\",\"en\":\"¥800 adult, ¥500 child. It closes without notice from time to time.\"},\"payments\":[\"cash\"]},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[],\"website\":\"https://shibuonsen.net/\",\"sources\":{\"officialUrl\":\"https://shibuonsen.net/guide/day-use-onsen/\",\"additionalUrls\":[\"https://www.shibuonsen.net/guide/day-use-onsen/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":120},\"dataStatus\":\"unverified\"},{\"slug\":\"beppu-shibunoyu\",\"name\":{\"ja\":\"渋の湯\",\"en\":\"Shibunoyu\"},\"romaji\":\"Shibunoyu\",\"area\":{\"ja\":\"別府温泉\",\"en\":\"Beppu Onsen\"},\"prefecture\":{\"ja\":\"大分県\",\"en\":\"Oita\"},\"region\":\"kyushu_okinawa\",\"location\":{\"lat\":33.3159979,\"lng\":131.4775619},\"tattoo\":{\"policy\":\"allowed\",\"notes\":{\"ja\":\"別府市が公開する「タトゥーOK温泉マップ」に、大浴場にタトゥーのまま入浴できる施設として掲載されています。\",\"en\":\"Listed on Beppu City's tattoo-friendly onsen map as a bath where tattooed guests may use the shared bath.\"},\"checkedAt\":\"2026-08-29\",\"sourceUrl\":\"https://enjoyonsen.city.beppu-jp.com/onsen/100tattoo-friendly_beppuonsen_japan/\"},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[]},\"visit\":{\"dayUse\":true,\"hours\":{\"ja\":\"6:30 - 20:30\",\"en\":\"6:30AM - 8:30PM\"},\"dayUsePriceYen\":100,\"priceNote\":{\"ja\":\"100円のコインロッカーを必ず利用してください。ロッカー代が入浴料の扱いになります。\",\"en\":\"Please be sure to use the 100-yen coin locker. Using the locker is considered as your admission fee.\"}},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[],\"sources\":{\"officialUrl\":\"https://enjoyonsen.city.beppu-jp.com/onsen/100tattoo-friendly_beppuonsen_japan/\"},\"verification\":{\"lastCheckedAt\":\"2026-08-29\",\"lastChangedAt\":\"2026-08-29\",\"method\":\"manual\",\"staleAfterDays\":120},\"dataStatus\":\"unverified\"},{\"slug\":\"nasu-shikanoyu\",\"name\":{\"ja\":\"那須温泉 鹿の湯\",\"en\":\"Shika-no-yu\"},\"romaji\":\"Shika no Yu\",\"area\":{\"ja\":\"那須温泉郷\",\"en\":\"Nasu Onsen-go\"},\"prefecture\":{\"ja\":\"栃木県\",\"en\":\"Tochigi\"},\"region\":\"kanto\",\"description\":{\"ja\":\"1,300年続く湯治場。41・42・43・44・46・48℃の6つの浴槽（女湯に48℃はありません）から温度を選んで入ります。単純酸性硫黄温泉（硫化水素型）で、pH は3未満です。\",\"en\":\"A cure bath in use for 1,300 years. You choose your tub from six temperatures — 41, 42, 43, 44, 46 and 48°C, the last of which the women's side does not have. The water is an acidic simple sulphur spring below pH 3.\"},\"location\":{\"address\":{\"ja\":\"栃木県那須郡那須町湯本181\",\"en\":\"181 Yumoto, Nasu-machi, Nasu-gun, Tochigi\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"公式サイトに入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。訪問前に電話（0287-76-3098）でご確認ください。\",\"en\":\"The official site says nothing about tattoos. That is not the same as having no rule — ring 0287-76-3098 before you visit.\"}},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[\"sulfur\",\"acidic\"],\"rulesNote\":{\"ja\":\"決まった入り方があります。まず「かぶり湯」をひしゃくで大人およそ200回、膝を湯船の縁に近づけ頭を下げて静かにかぶります（のぼせと吐き気を防ぐため）。入浴は腰まで1分・胸まで1分・首まで1分を繰り返す短熱浴で、1回15分程度、1日4回までが目安です。湯上がりは体を冷やさないこと。\",\"en\":\"There is a set way to use it. First the kaburi-yu: about 200 scoops of water poured over your own head, knees to the rim and head down, quietly — it is what stops you feeling faint or sick. Then bathe in short bursts, a minute to the waist, a minute to the chest, a minute to the neck, repeated; about fifteen minutes a time and no more than four times a day. Do not let yourself get cold afterwards.\"}},\"visit\":{\"dayUse\":true,\"overnight\":false,\"dayUsePriceYen\":500,\"priceNote\":{\"ja\":\"大人500円、小学生300円、幼児無料。湯治体験半日券は平日1,200円・土日祝1,500円。回数券は7枚つづり2,800円。ロッカーは大200円・小100円。営業時間は那須町観光協会の日帰り湯検索によります（公式サイトでは画像でのみ示されています）。\",\"en\":\"¥500 adult, ¥300 primary school, free for infants. A half-day cure ticket is ¥1,200 on weekdays and ¥1,500 at weekends. A book of seven is ¥2,800. Lockers are ¥200 large, ¥100 small. The hours come from the Nasu tourism association's listing; the facility's own site shows them only as an image.\"},\"payments\":[\"cash\"],\"hours\":{\"ja\":\"8:00〜17:30\",\"en\":\"8:00-17:30\"}},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"history\"],\"website\":\"https://www.shikanoyu.jp/\",\"sources\":{\"officialUrl\":\"https://www.shikanoyu.jp/time-charge/\",\"additionalUrls\":[\"https://www.shikanoyu.jp/hotspa/\",\"https://www.nasukogen.org/onsen/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"unverified\"},{\"slug\":\"ikaho-utopia-akagi\",\"name\":{\"ja\":\"敷島温泉 ユートピア赤城\",\"en\":\"Shikishima Onsen Utopia Akagi\"},\"romaji\":\"Shikishima Onsen Utopia Akagi\",\"area\":{\"ja\":\"渋川伊香保温泉\",\"en\":\"Shibukawa-Ikaho Onsen\"},\"prefecture\":{\"ja\":\"群馬県\",\"en\":\"Gunma\"},\"region\":\"kanto\",\"location\":{\"address\":{\"ja\":\"群馬県渋川市赤城町宮田850-3（敷島温泉）\",\"en\":\"敷島温泉 area, Shibukawa, Gunma\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"施設側にも渋川伊香保温泉観光協会にも、入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。訪問前に施設へ電話でご確認ください。\",\"en\":\"Neither the facility nor the Shibukawa-Ikaho tourism association publishes anything about tattoos. That is not the same as having no rule — call ahead before you visit.\"}},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[]},\"visit\":{\"dayUse\":true,\"overnight\":false,\"priceNote\":{\"ja\":\"渋川伊香保温泉観光協会が日帰り温泉として挙げていますが、料金と営業時間は公開されていません。施設へお問い合わせください。\",\"en\":\"Listed by the Shibukawa-Ikaho tourism association as a day-use bath, but no price or hours are published. Ask the facility.\"}},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"onsen_town_walk\"],\"sources\":{\"officialUrl\":\"https://www.ikaho-kankou.com/spring/\",\"additionalUrls\":[\"https://www.ikaho-kankou.com/spring/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"stub\"},{\"slug\":\"shima-seiryu-no-yu\",\"name\":{\"ja\":\"町営 四万清流の湯\",\"en\":\"Shima Seiryu-no-yu\"},\"romaji\":\"Shima Seiryu-no-yu\",\"area\":{\"ja\":\"四万温泉\",\"en\":\"Shima Onsen\"},\"prefecture\":{\"ja\":\"群馬県\",\"en\":\"Gunma\"},\"region\":\"kanto\",\"description\":{\"ja\":\"中之条町が運営する日帰り温泉で、露天風呂があります。\",\"en\":\"The town of Nakanojo's own day-use bath, with an open-air section.\"},\"location\":{\"address\":{\"ja\":\"群馬県吾妻郡中之条町四万\",\"en\":\"Shima, Nakanojo-machi, Agatsuma-gun, Gunma\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"施設側にも四万温泉協会にも、入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。訪問前にご確認ください。\",\"en\":\"Neither the facility nor the Shima tourism association publishes anything about tattoos. That is not the same as having no rule — check before you visit.\"}},\"bath\":{\"types\":[\"outdoor\",\"indoor\"],\"springQualities\":[]},\"visit\":{\"dayUse\":true,\"overnight\":false,\"priceNote\":{\"ja\":\"四万温泉協会が町営の日帰り温泉として挙げていますが、料金と営業時間は公開されていません。施設へお問い合わせください。\",\"en\":\"Listed by the Shima tourism association as the town's day-use bath, but no price or hours are published. Ask the facility.\"}},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"onsen_town_walk\"],\"sources\":{\"officialUrl\":\"https://nakanojo-kanko.jp/shima/hotsprings/\",\"additionalUrls\":[\"https://nakanojo-kanko.jp/shima/appeal/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"stub\"},{\"slug\":\"zao-shimoyu\",\"name\":{\"ja\":\"下湯共同浴場\",\"en\":\"Shimo-yu\"},\"romaji\":\"Shimo-yu\",\"area\":{\"ja\":\"蔵王温泉\",\"en\":\"Zao Onsen\"},\"prefecture\":{\"ja\":\"山形県\",\"en\":\"Yamagata\"},\"region\":\"tohoku\",\"description\":{\"ja\":\"3つの共同浴場のひとつで、足湯が併設されています。\",\"en\":\"One of the three communal baths, with a footbath beside it.\"},\"location\":{\"address\":{\"ja\":\"山形県山形市蔵王温泉\",\"en\":\"Zao Onsen, Yamagata, Yamagata\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"施設側にも蔵王温泉観光協会にも、入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。共同浴場は無人のため、蔵王温泉観光協会（023-694-9328）へお問い合わせください。\",\"en\":\"Neither the bathhouse nor the Zao tourism association publishes anything about tattoos. That is not the same as having no rule. The communal baths are unstaffed, so ask the Zao tourism association on 023-694-9328.\"}},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[\"sulfur\",\"acidic\"],\"rulesNote\":{\"ja\":\"無人の浴場です。入口の料金箱に自分で料金を入れて利用します。全国でも珍しい強い酸性の硫黄泉で、皮膚に刺激があります。\",\"en\":\"The bathhouse is unstaffed: you put the money in the box at the entrance yourself. The water is strongly acidic sulphur, which is unusual anywhere and can sting.\"}},\"visit\":{\"dayUse\":true,\"overnight\":false,\"hours\":{\"ja\":\"6:00〜22:00\",\"en\":\"6:00-22:00\"},\"dayUsePriceYen\":200,\"priceNote\":{\"ja\":\"大人200円、小人100円。無人のため、入口の料金箱に入れて利用します。\",\"en\":\"¥200 adult, ¥100 child, into the box at the entrance — nobody is on the door.\"},\"payments\":[\"cash\"]},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"onsen_town_walk\",\"skiing\"],\"sources\":{\"officialUrl\":\"https://yamagatakanko.com/attractions/detail_10816.html\",\"additionalUrls\":[\"https://zaomountainresort.com/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"unverified\"},{\"slug\":\"nozawa-shin\",\"name\":{\"ja\":\"真湯\",\"en\":\"Shin-yu\"},\"romaji\":\"Shin-yu\",\"area\":{\"ja\":\"野沢温泉\",\"en\":\"Nozawa Onsen\"},\"prefecture\":{\"ja\":\"長野県\",\"en\":\"Nagano\"},\"region\":\"chubu\",\"location\":{},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"村人が管理する共同浴場で、入れ墨・タトゥーに関する規定は公表されていません。公営・共同の浴場は正当な理由なく利用を拒めない立場にありますが、掲示や運用は湯ごとに異なりうるため、現地での確認をおすすめします。\",\"en\":\"A communal bath run by the villagers, with no published rule about tattoos. Baths of this kind cannot refuse use without proper grounds, but what is posted varies from one to the next, so check when you arrive.\"},\"checkedAt\":\"2026-08-29\",\"sourceUrl\":\"https://nozawakanko.jp/hotspring/\"},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[\"sulfur\"],\"genderArrangement\":\"separate\",\"rulesNote\":{\"ja\":\"「五色の湯」とも呼ばれ、乳白色からエメラルド色まで湯の色が変わります。湯の華が豊富。共同浴場の作法として、入浴前に体を洗う／浴槽にタオルを入れない／湯が熱ければ加水せず給水を止める／深夜の入浴は控える、が求められます。\",\"en\":\"Nicknamed the five-coloured bath: the water shifts between milky white and emerald, and is thick with mineral flakes. House rules of a communal bath: wash before getting in, keep the towel out of the water, turn the inflow off rather than adding cold water, and do not bathe late at night.\"}},\"visit\":{\"dayUse\":true,\"dayUsePriceYen\":0,\"priceNote\":{\"ja\":\"村人が「湯仲間」の制度で維持・管理しており、賽銭箱への寸志の寄付が慣習です。\",\"en\":\"Maintained by residents under the yunakama system; a small donation in the box is customary.\"},\"towel\":\"bring_your_own\",\"payments\":[\"cash\"]},\"access\":{\"nearestStation\":{\"name\":{\"ja\":\"飯山駅\",\"en\":\"Iiyama Sta.\"},\"busMinutes\":25,\"note\":{\"ja\":\"北陸新幹線飯山駅からバス約25分。外湯は温泉街を歩いて回れる範囲に13湯あります。\",\"en\":\"About 25 minutes by bus from Iiyama Station on the Hokuriku Shinkansen. All thirteen baths are within walking distance of one another.\"}},\"carRecommended\":false},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"onsen_town_walk\",\"snow_view\",\"skiing\"],\"website\":\"https://nozawakanko.jp/hotspring/\",\"sources\":{\"officialUrl\":\"https://nozawakanko.jp/hotspring/\",\"additionalUrls\":[\"https://nozawakanko.jp/about/hot_spring/sotoyu/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-29\",\"lastChangedAt\":\"2026-08-29\",\"method\":\"manual\",\"staleAfterDays\":180},\"dataStatus\":\"unverified\"},{\"slug\":\"shimosuwa-shinyu\",\"name\":{\"ja\":\"新湯\",\"en\":\"Shin-yu\"},\"romaji\":\"Shin-yu\",\"area\":{\"ja\":\"下諏訪温泉\",\"en\":\"Shimosuwa Onsen\"},\"prefecture\":{\"ja\":\"長野県\",\"en\":\"Nagano\"},\"region\":\"chubu\",\"description\":{\"ja\":\"昭和2年に開湯したレトロな浴場。わずかに塩味があり、リューマチや神経痛に効くとされます。\",\"en\":\"Opened in 1927 and unchanged in feel. The water is faintly salty, and has a reputation for rheumatism and neuralgia.\"},\"location\":{\"address\":{\"ja\":\"長野県諏訪郡下諏訪町\",\"en\":\"Shimosuwa-machi, Suwa-gun, Nagano\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"施設側にも下諏訪町観光協会にも、入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。訪問前にご確認ください。\",\"en\":\"Neither the facility nor the Shimosuwa tourism association publishes anything about tattoos. That is not the same as having no rule — check before you visit.\"}},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[]},\"visit\":{\"dayUse\":true,\"overnight\":false,\"hours\":{\"ja\":\"5:30〜22:00（最終受付 21:30）。2025年9月8日から当面のあいだ 9:00〜20:00（最終受付 19:30）。\",\"en\":\"5:30-22:00 (last entry 21:30). Since 8 September 2025 and until further notice, 9:00-20:00 (last entry 19:30).\"},\"closedDays\":{\"ja\":\"年中無休（メンテナンス休業あり）\",\"en\":\"Open every day, apart from maintenance\"},\"dayUsePriceYen\":300,\"priceNote\":{\"ja\":\"大人300円。\",\"en\":\"¥300 for an adult.\"},\"payments\":[\"cash\"]},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"onsen_town_walk\",\"history\"],\"sources\":{\"officialUrl\":\"https://shimosuwaonsen.jp/spa/1037/\",\"additionalUrls\":[\"https://shimosuwaonsen.jp/spa/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"unverified\"},{\"slug\":\"nozawa-shinden\",\"name\":{\"ja\":\"新田の湯\",\"en\":\"Shinden-no-yu\"},\"romaji\":\"Shinden-no-yu\",\"area\":{\"ja\":\"野沢温泉\",\"en\ \"https://nozawakanko.jp/hotspring/\",\"additionalUrls\":[\"https://nozawakanko.jp/about/hot_spring/sotoyu/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-29\",\"lastChangedAt\":\"2026-08-29\",\"method\":\"manual\",\"staleAfterDays\":180},\"dataStatus\":\"unverified\"},{\"slug\":\"okuhida-shinhotaka-no-yu\",\"name\":{\"ja\":\"新穂高の湯\",\"en\":\"Shinhotaka-no-yu\"},\"romaji\":\"Shinhotaka-no-yu\",\"area\":{\"ja\":\"奥飛騨温泉郷\",\"en\":\"Okuhida Onsen-go\"},\"prefecture\":{\"ja\":\"岐阜県\",\"en\":\"Gifu\"},\"region\":\"chubu\",\"description\":{\"ja\":\"日帰り施設のなかで唯一の混浴露天風呂。清流・蒲田川のわきで、渓谷の眺めが開けています。新緑の時期はライトアップされます。\",\"en\":\"The only mixed open-air bath among the day-use places here, beside the clear Gamata river with the gorge open in front of it. It is lit up when the new leaves come.\"},\"location\":{\"address\":{\"ja\":\"岐阜県高山市奥飛騨温泉郷神坂（新穂高温泉）\",\"en\":\"新穂高温泉 area, Okuhida Onsen-go, Takayama, Gifu\"}},\"tattoo\":{\"policy\":\"unknown\",\"notes\":{\"ja\":\"施設側にも奥飛騨温泉郷観光協会にも、入れ墨・タトゥーに関する記載が見つかりませんでした。方針が無いという意味ではありません。訪問前に施設へ電話でご確認ください。\",\"en\":\"Neither the facility nor the Okuhida tourism association publishes anything about tattoos. That is not the same as having no rule — call ahead before you visit.\"}},\"bath\":{\"types\":[\"outdoor\",\"mixed\"],\"springQualities\":[\"simple\"],\"genderArrangement\":\"mixed_available\",\"genderNote\":{\"ja\":\"男女混浴で、脱衣場は男女別です。入浴には水着または湯あみ着が必要で、湯あみ着は「ひがくの湯」または「中崎山荘奥飛騨の湯」で350円で買えます。\",\"en\":\"Mixed bathing, with separate changing rooms. A swimsuit or a bathing garment is required; the garment is sold for ¥350 at Higaku-no-yu and at Nakazaki Sanso.\"}},\"visit\":{\"dayUse\":true,\"hours\":{\"ja\":\"4月下旬〜10月末 8:00〜18:00。毎週月・金は清掃日（特に月曜の 13:00〜15:00 は利用できません）\",\"en\":\"Late April to the end of October, 8:00-18:00. Cleaning on Mondays and Fridays; Monday 13:00-15:00 in particular is closed\"},\"closedDays\":{\"ja\":\"冬期休業（10月31日〜4月下旬）。増水時は休業。\",\"en\":\"Closed in winter, from 31 October to late April, and when the river is high.\"},\"dayUsePriceYen\":300,\"priceNote\":{\"ja\":\"清掃協力金（300円程度）。\",\"en\":\"A cleaning contribution of about ¥300.\"},\"payments\":[\"cash\"]},\"access\":{\"carRecommended\":true},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[\"hot_spring_hopping\",\"hiking\",\"snow_view\"],\"sources\":{\"officialUrl\":\"https://okuhida.or.jp/hot-springs/\",\"additionalUrls\":[\"https://okuhida.or.jp/hot-springs/\"]},\"verification\":{\"lastCheckedAt\":\"2026-08-30\",\"lastChangedAt\":\"2026-08-30\",\"method\":\"manual\",\"staleAfterDays\":90},\"dataStatus\":\"unverified\"},{\"slug\":\"beppu-shinkousen\",\"name\":{\"ja\":\"新光泉\",\"en\":\"Shinkousen\"},\"romaji\":\"Shinkousen\",\"area\":{\"ja\":\"別府温泉\",\"en\":\"Beppu Onsen\"},\"prefecture\":{\"ja\":\"大分県\",\"en\":\"Oita\"},\"region\":\"kyushu_okinawa\",\"location\":{\"lat\":33.2752557,\"lng\":131.4920799},\"tattoo\":{\"policy\":\"allowed\",\"notes\":{\"ja\":\"別府市が公開する「タトゥーOK温泉マップ」に、大浴場にタトゥーのまま入浴できる施設として掲載されています。\",\"en\":\"Listed on Beppu City's tattoo-friendly onsen map as a bath where tattooed guests may use the shared bath.\"},\"checkedAt\":\"2026-08-29\",\"sourceUrl\":\"https://enjoyonsen.city.beppu-jp.com/onsen/100tattoo-friendly_beppuonsen_japan/\"},\"bath\":{\"types\":[\"indoor\"],\"springQualities\":[]},\"visit\":{\"dayUse\":true,\"hours\":{\"ja\":\"12:00 - 16:00\",\"en\":\"12:00PM - 4:00PM\"},\"closedDays\":{\"ja\":\"不定休\",\"en\":\"Irregular days\"},\"dayUsePriceYen\":300},\"access\":{},\"food\":{\"styles\":[],\"dietary\":[]},\"activities\":[],\"sources\":{\"officialUrl\":\"https://enjoyonsen.city.beppu-jp.com/onsen/100tattoo-friendly_beppuonsen_japan/\"},\"verification\":{\"lastCheckedAt\":\"2026-08-29\",\"lastChangedAt\":\"2026-08-29\",\"method\":\"manual\",\"staleAfterDays\":120},\"dataStatus\":\"unverified\"},{\"slug\":\"kurokawa-shinmeikan\",\"name\":{\"ja\":\"新明館\",\"en\":\"Shinmeikan\"},\"romaji\":\"Shinmeikan\",\"area\":{\"ja\":\"黒川温泉\",\"en\":\"Kurokawa Onsen\"},\"prefecture\":{\"ja\":\"熊本県\",\"en\":\"Kumamoto\"}
